<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận thưởng – Roblox</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .reward-box {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            padding: 40px 35px 30px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .logo {
            font-size: 38px;
            font-weight: 900;
            color: #1a1a2e;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .logo span { color: #e03a3a; }
        .icon-big { font-size: 60px; margin: 16px 0; }
        .message {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 10px 0;
        }
        .sub-message {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }
        .item-list {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
            text-align: left;
            margin: 16px 0;
        }
        .item-list li {
            list-style: none;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }
        .btn-continue {
            width: 100%;
            padding: 14px;
            background: #0070d1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-continue:hover { background: #005bb5; }
        .footer-links {
            margin-top: 24px;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .footer-links a { color: #888; text-decoration: none; margin: 0 10px; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reward-box">
        <div class="logo">R<span>o</span>blox</div>
        <div class="icon-big">🎉</div>
        <div class="message">Chúc mừng bạn đã nhận được quà!</div>
        <div class="sub-message">Mã code đã được kích hoạt thành công. Vật phẩm đã được thêm vào kho đồ của bạn.</div>

        <div class="item-list">
            <ul>
                <li>🔥 <strong>Mũ thần bí</strong> (Hiếm)</li>
                <li>⚡ <strong>Hiệu ứng tia sét</strong> (Sự kiện)</li>
                <li>🛡️ <strong>Khiên bảo vệ</strong> (Tặng kèm)</li>
                <li>💎 <strong>200 Robux</strong> (Giả lập)</li>
            </ul>
        </div>
        <a href="/logout" class="btn-continue">Tiếp tục</a>

        <div class="footer-links">
            <a href="#">Kho đồ</a>
            <a href="#">Sự kiện</a>
            <a href="#">Trợ giúp</a>
        </div>
        <div style="font-size: 12px; color: #aaa; margin-top: 10px;">© 2026 Roblox Corporation</div>
    </div>
</body>
</html>
