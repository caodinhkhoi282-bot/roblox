<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận thưởng – Roblox</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; }
        body {
            background: #1a1a2e;
            background-image: url('https://cdn2.fptshop.com.vn/unsafe/1920x0/filters:format(webp):quality(75)/roblox_cover_be7d1828cd.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .reward-box {
            background: #2d2d2d;
            max-width: 420px;
            width: 100%;
            padding: 32px 28px 28px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #444;
        }
        .logo {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .logo .o-red { color: #e03a3a; }
        .icon-big { font-size: 48px; margin: 16px 0; }
        .message {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin: 10px 0;
        }
        .sub-message {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .btn-continue {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #0070d1;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            margin-top: 10px;
        }
        .btn-continue:hover { background: #005bb5; }
        .footer-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 20px;
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 16px;
        }
        .footer-tabs a { color: #aaa; text-decoration: none; }
        .footer-tabs a:hover { text-decoration: underline; }
        .copyright { text-align: center; font-size: 12px; color: #777; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="reward-box">
        <div class="logo">R<span class="o-red">o</span>blox</div>
        <div class="icon-big">🎉</div>
        <div class="message">Chúc mừng bạn đã nhận được quà!</div>
        <div class="sub-message">Mã code đã được kích hoạt thành công. Vật phẩm đã được thêm vào kho đồ của bạn.</div>

        <a href="/logout" class="btn-continue">Tiếp tục</a>

        <div class="footer-tabs">
            <a href="#">Kho đồ</a>
            <a href="#">Sự kiện</a>
            <a href="#">Trợ giúp</a>
        </div>
        <div class="copyright">© 2026 Roblox Corporation</div>
    </div>
</body>
</html>
