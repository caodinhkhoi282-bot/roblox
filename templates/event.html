<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sự kiện Code 2026 – Roblox</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .event-box {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            padding: 40px 35px 30px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .logo {
            font-size: 38px;
            font-weight: 900;
            color: #1a1a2e;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .logo span { color: #e03a3a; }
        .subtitle {
            color: #666;
            font-size: 15px;
            margin: 8px 0 20px;
        }
        .code-input {
            margin: 20px 0;
        }
        .code-input input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            background: #f9f9f9;
            transition: 0.2s;
            outline: none;
            letter-spacing: 2px;
        }
        .code-input input:focus {
            border-color: #0070d1;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,112,209,0.15);
        }
        .btn-redeem {
            width: 100%;
            padding: 14px;
            background: #0070d1;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-redeem:hover { background: #005bb5; }
        .btn-redeem:active { transform: scale(0.97); }
        .error-msg {
            color: #d32f2f;
            font-size: 14px;
            margin: 12px 0;
            background: #ffebee;
            padding: 10px;
            border-radius: 6px;
        }
        .info-text {
            font-size: 14px;
            color: #555;
            margin-top: 16px;
        }
        .info-text a { color: #0070d1; text-decoration: none; }
        .footer-links {
            margin-top: 24px;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .footer-links a { color: #888; text-decoration: none; margin: 0 10px; }
        .footer-links a:hover { text-decoration: underline; }
        .user-greeting {
            color: #1a1a2e;
            font-weight: 600;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="event-box">
        <div class="logo">R<span>o</span>blox</div>
        <div class="subtitle">🎁 Sự kiện Code 2026</div>
        <div class="user-greeting">Chào <strong>{{ username }}</strong>! Nhập mã code để nhận quà.</div>

        <form action="/redeem" method="POST">
            <div class="code-input">
                <input type="text" id="code" name="code" placeholder="Nhập mã code sự kiện" required autofocus>
            </div>
            <button type="submit" class="btn-redeem">Xác nhận</button>
        </form>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <div class="info-text">
            <a href="#">Điều kiện tham gia</a> • <a href="#">Hướng dẫn</a>
        </div>

        <div class="footer-links">
            <a href="#">Đăng ký</a>
            <a href="#">Về chúng tôi</a>
            <a href="#">Trợ giúp</a>
        </div>
        <div style="font-size: 12px; color: #aaa; margin-top: 10px;">© 2026 Roblox Corporation</div>
    </div>
</body>
  </html>
