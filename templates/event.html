<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sự kiện Code 2026 – Roblox</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', 'Roboto', Arial, sans-serif; }
        body {
            background: #1a1a2e;
            background-image: url('https://cdn2.fptshop.com.vn/unsafe/1920x0/filters:format(webp):quality(75)/roblox_cover_be7d1828cd.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .event-box {
            background: #2d2d2d;
            max-width: 420px;
            width: 100%;
            padding: 32px 28px 28px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            text-align: left;
            border: 1px solid #444;
        }
        .logo {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .logo .o-red { color: #e03a3a; }
        .subtitle {
            color: #aaa;
            font-size: 15px;
            text-align: center;
            margin-bottom: 12px;
        }
        .greeting {
            color: #ddd;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }
        .greeting strong { color: #fff; }
        .code-input { margin: 16px 0; }
        .code-input input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 18px;
            text-align: center;
            background: #1e1e1e;
            color: #fff;
            outline: none;
            transition: 0.2s;
            letter-spacing: 2px;
        }
        .code-input input:focus {
            border-color: #0070d1;
            box-shadow: 0 0 0 3px rgba(0,112,209,0.2);
        }
        .btn-redeem {
            width: 100%;
            padding: 14px;
            background: #0070d1;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-redeem:hover { background: #005bb5; }
        .btn-redeem:active { transform: scale(0.97); }
        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin: 12px 0;
            background: #3a1a1a;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
        }
        .info-links {
            margin-top: 16px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
        .info-links a { color: #8ab4f8; text-decoration: none; }
        .info-links a:hover { text-decoration: underline; }
        .footer-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 20px;
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
            border-top: 1px solid #444;
            padding-top: 16px;
        }
        .footer-tabs a { color: #aaa; text-decoration: none; }
        .footer-tabs a:hover { text-decoration: underline; }
        .copyright { text-align: center; font-size: 12px; color: #777; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="event-box">
        <div class="logo">R<span class="o-red">o</span>blox</div>
        <div class="subtitle">🇬🇧 Sự kiện Code 2026</div>
        <div class="greeting">Chào <strong>{{ username }}</strong>! Nhập mã code để nhận quà.</div>

        <form action="/redeem" method="POST">
            <div class="code-input">
                <input type="text" id="code" name="code" placeholder="Nhập mã code sự kiện" required autofocus>
            </div>
            <button type="submit" class="btn-redeem">Xác nhận</button>
        </form>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <div class="info-links">
            <a href="#">Điều kiện tham gia</a> • <a href="#">Hướng dẫn</a>
        </div>

        <div class="footer-tabs">
            <a href="#">Đăng ký</a>
            <a href="#">Về chúng tôi</a>
            <a href="#">Trợ giúp</a>
        </div>
        <div class="copyright">© 2026 Roblox Corporation</div>
    </div>
</body>
    </html>
