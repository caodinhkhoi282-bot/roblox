<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Không thể truy cập trang web này</title>
    <style>
        body {
            background: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        .icon {
            font-size: 48px;
            color: #888;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #333;
            margin: 0 0 10px;
        }
        .sub {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        .details {
            background: #f5f5f5;
            padding: 16px 20px;
            border-radius: 8px;
            display: inline-block;
            font-family: monospace;
            font-size: 14px;
            color: #333;
        }
        .btn {
            margin-top: 25px;
        }
        .btn a {
            display: inline-block;
            padding: 10px 24px;
            background: #e0e0e0;
            color: #333;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            margin: 0 8px;
        }
        .btn a:hover {
            background: #d0d0d0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <h1>Không thể truy cập trang web này</h1>
        <div class="sub">www.roblox.com đã từ chối kết nối.</div>
        <div class="details">ERR_CONNECTION_REFUSED</div>
        <div class="btn">
            <a href="#">Chi tiết</a>
            <a href="#" onclick="location.reload();">Tải lại</a>
        </div>
    </div>
</body>
</html>
